upstream file_server_upstream {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name www.nextself.top nextself.top;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.nextself.top nextself.top;

  ssl_certificate /etc/letsencrypt/live/nextself.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nextself.top/privkey.pem;

  client_max_body_size 512m;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_request_buffering off;

    proxy_pass http://file_server_upstream;
  }
}

server {
  listen 80;
  server_name extension.nextself.top;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name extension.nextself.top;

  ssl_certificate /etc/letsencrypt/live/extension.nextself.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/extension.nextself.top/privkey.pem;

  client_max_body_size 64m;
  root /usr/ydj/chrome-extens-html;
  index index.html;

  location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location ~* \.(css|js)$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location ~* \.(png|jpg|jpeg|gif|webp|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }
}

# api.nextself.top — API server (Flask on port 5050)
server {
  server_name api.nextself.top;

  client_max_body_size 64m;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://127.0.0.1:5050;
  }

  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/api.nextself.top/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/api.nextself.top/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
  if ($host = api.nextself.top) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  listen 80;
  server_name api.nextself.top;
  return 404; # managed by Certbot
}
