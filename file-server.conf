upstream file_server_upstream {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name www.nextself.top nextself.top;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.nextself.top nextself.top;

  ssl_certificate /etc/letsencrypt/live/nextself.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nextself.top/privkey.pem;

  client_max_body_size 512m;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_request_buffering off;

    proxy_pass http://file_server_upstream;
  }
}

server {
  listen 80;
  server_name extension.nextself.top;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name extension.nextself.top;

  ssl_certificate /etc/letsencrypt/live/extension.nextself.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/extension.nextself.top/privkey.pem;

  client_max_body_size 64m;
  root /usr/ydj/chrome-extens-html;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }
}
